# Sveltia CMS configuration.
# See the "Editing in the browser" section of README.md for the setup steps.

backend:
  name: github
  repo: varneridge/samuelleigh-co-uk
  branch: main
  base_url: https://sveltia-cms-auth.samuel-leigh147.workers.dev

media_folder: public/images
public_folder: /images

collections:
  - name: writing
    label: Writing
    label_singular: Article
    description: Essays and articles. New pieces start as drafts.
    folder: src/content/writing
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - name: title
        label: Title
        widget: string
        hint: Write it as something a person might click, not as an essay question.
      - name: date
        label: Date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - name: summary
        label: One-line summary
        widget: text
        hint: Shown under the title in lists. Keep it under about 20 words.
      - name: note
        label: Note
        widget: string
        required: false
        hint: Optional. Use this to say a piece began as coursework.
      - name: thumbnail
        label: Thumbnail
        widget: image
        required: false
        hint: 'Card image shown in lists. Crop to 4:3, around 400x300 pixels.'
      - name: committee
        label: Committee
        widget: string
        required: false
        hint: Hearing notes only. Leave blank for an ordinary article.
      - name: session
        label: Session
        widget: string
        required: false
      - name: witnesses
        label: Witnesses
        widget: string
        required: false
      - name: attendance
        label: Attendance
        widget: select
        required: false
        options: ['In person', 'Watched online']
        hint: Say "In person" only where you were in the room.
      - name: draft
        label: Draft
        widget: boolean
        default: true
        hint: Leave on until the piece is finished. Drafts do not appear on the site.
      - name: body
        label: Body
        widget: markdown

